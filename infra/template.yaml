# WY Filing Notices: the dedicated AWS account's resources (us-east-1). NOT DEPLOYED. Review, then create the stack
# from the AWS console (CloudFormation > Create stack > Upload) in the NEW account only, after BK approves the cost.
#
# Trust zones: the worker (no inbound, no public address, no stored keys) reaches the internet only through the
# egress proxy (domain allowlist with SNI checked against the CONNECT host), and AWS APIs only through VPC endpoints
# whose policies allow this account's own resources. No AWS hostname is on the proxy allowlist: a shared AWS API
# endpoint reachable through the proxy would let a compromised worker send data into an attacker's own account.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'WYFN filing worker, card release function, grant ledger, alerting, backups (single-purpose account)'

Parameters:
  OwnerEmail: { Type: String, Default: hello@bkhomephotos.com }
  # BK's approval of a worker release: the full commit id of a worker-v* tag in wyfn-filing-worker. Empty: no worker
  # image is built and no worker runs. Changing it (Update stack) is the ONLY way new worker code reaches AWS.
  WorkerCommit: { Type: String, Default: '', AllowedPattern: '^([0-9a-f]{40})?$', Description: 'Approved worker release commit (40 hex characters), or empty' }
  WorkerBaseImage: { Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>', Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id, Description: 'Ubuntu 24.04 base for the worker image (resolved when the stack is updated)' }
  ProxyAmiId: { Type: AWS::EC2::Image::Id, Description: Ubuntu 24.04 arm64 for the proxy }
  PaymentHost: { Type: String, Description: "The payment page's exact host, recorded in Phase 0 (e.g. www.convergepay.com)" }
  SiteHost: { Type: String, Default: wyfilingnotices.com }

Conditions:
  HasWorker: !Not [!Equals [!Ref WorkerCommit, '']]

Resources:
  # ---------- network ----------
  Vpc: { Type: AWS::EC2::VPC, Properties: { CidrBlock: 10.40.0.0/16, EnableDnsSupport: true, EnableDnsHostnames: true } }
  WorkerSubnetA: { Type: AWS::EC2::Subnet, Properties: { VpcId: !Ref Vpc, CidrBlock: 10.40.1.0/24, AvailabilityZone: !Select [0, !GetAZs ''] } }
  WorkerSubnetB: { Type: AWS::EC2::Subnet, Properties: { VpcId: !Ref Vpc, CidrBlock: 10.40.2.0/24, AvailabilityZone: !Select [1, !GetAZs ''] } }
  ProxySubnet: { Type: AWS::EC2::Subnet, Properties: { VpcId: !Ref Vpc, CidrBlock: 10.40.10.0/24, AvailabilityZone: !Select [0, !GetAZs ''] } }
  Igw: { Type: AWS::EC2::InternetGateway }
  IgwAttach: { Type: AWS::EC2::VPCGatewayAttachment, Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw } }
  ProxyRoutes: { Type: AWS::EC2::RouteTable, Properties: { VpcId: !Ref Vpc } }
  ProxyDefault: { Type: AWS::EC2::Route, DependsOn: IgwAttach, Properties: { RouteTableId: !Ref ProxyRoutes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw } }
  ProxyRoutesAssoc: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref ProxySubnet, RouteTableId: !Ref ProxyRoutes } }
  # Image builds only: a temporary build instance with a public address (it downloads the pinned inputs), terminated
  # when the build ends. Nothing else runs here.
  BuildSubnet: { Type: AWS::EC2::Subnet, Properties: { VpcId: !Ref Vpc, CidrBlock: 10.40.20.0/24, AvailabilityZone: !Select [0, !GetAZs ''], MapPublicIpOnLaunch: true } }
  BuildRoutesAssoc: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref BuildSubnet, RouteTableId: !Ref ProxyRoutes } }
  BuildSg: { Type: AWS::EC2::SecurityGroup, Properties: { VpcId: !Ref Vpc, GroupDescription: 'image builds - no inbound' } }
  # The worker subnets have NO route to the internet at all: only the VPC (proxy, endpoints).
  WorkerRoutes: { Type: AWS::EC2::RouteTable, Properties: { VpcId: !Ref Vpc } }
  WorkerAssocA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref WorkerSubnetA, RouteTableId: !Ref WorkerRoutes } }
  WorkerAssocB: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref WorkerSubnetB, RouteTableId: !Ref WorkerRoutes } }

  WorkerSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: worker - no inbound; out only to the proxy and the endpoints
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 3128, ToPort: 3128, DestinationSecurityGroupId: !Ref ProxySg }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointSg }
  ProxySg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: egress proxy - in from the worker only
      SecurityGroupEgress: [{ IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }, { IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: 10.40.0.2/32 }]
  ProxyIngress: { Type: AWS::EC2::SecurityGroupIngress, Properties: { GroupId: !Ref ProxySg, IpProtocol: tcp, FromPort: 3128, ToPort: 3128, SourceSecurityGroupId: !Ref WorkerSg } }
  EndpointSg:
    Type: AWS::EC2::SecurityGroup
    Properties: { VpcId: !Ref Vpc, GroupDescription: 'VPC endpoints - in from the worker only', SecurityGroupEgress: [{ IpProtocol: '-1', CidrIp: 127.0.0.1/32 }] }
  EndpointIngress: { Type: AWS::EC2::SecurityGroupIngress, Properties: { GroupId: !Ref EndpointSg, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref WorkerSg } }

  # Endpoints, one AZ each (about $7.30 a month each). Their policies admit only this account's own resources.
  LambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref WorkerSubnetA]
      SecurityGroupIds: [!Ref EndpointSg]
      PolicyDocument:
        Statement: [{ Effect: Allow, Principal: '*', Action: lambda:InvokeFunction, Resource: !GetAtt ReleaseFunction.Arn }]
  SecretsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref WorkerSubnetA]
      SecurityGroupIds: [!Ref EndpointSg]
      PolicyDocument:
        Statement: [{ Effect: Allow, Principal: '*', Action: secretsmanager:GetSecretValue, Resource: !Ref WorkerKeySecret }]

  # ---------- keys and secrets ----------
  CardKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: decrypts card secrets; usable by the release function only
      PendingWindowInDays: 30
      EnableKeyRotation: true
      KeyPolicy:
        Statement:
          - { Sid: Admin, Effect: Allow, Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }, Action: ['kms:Create*', 'kms:Describe*', 'kms:Enable*', 'kms:List*', 'kms:Put*', 'kms:Update*', 'kms:Revoke*', 'kms:Disable*', 'kms:Get*', 'kms:Delete*', 'kms:TagResource', 'kms:UntagResource', 'kms:ScheduleKeyDeletion', 'kms:CancelKeyDeletion', 'kms:Encrypt', 'kms:GenerateDataKey'], Resource: '*' }
          - { Sid: ReleaseDecrypt, Effect: Allow, Principal: { AWS: !GetAtt ReleaseRole.Arn }, Action: kms:Decrypt, Resource: '*' }
          # Nothing else may decrypt, whatever an IAM policy says (the account root keeps admin, not use).
          - Sid: DenyOtherDecrypt
            Effect: Deny
            Principal: '*'
            Action: kms:Decrypt
            Resource: '*'
            Condition: { ArnNotEquals: { 'aws:PrincipalArn': !GetAtt ReleaseRole.Arn } }
  CardKeyAlias: { Type: AWS::KMS::Alias, Properties: { AliasName: alias/wyfn-card, TargetKeyId: !Ref CardKey } }
  CardPrimarySecret: { Type: AWS::SecretsManager::Secret, Properties: { Name: wyfn/card/chase, KmsKeyId: !Ref CardKey, Description: 'Chase employee card. Value set by BK with scripts/card-provision.sh, never by anything else' } }
  CardBackupSecret: { Type: AWS::SecretsManager::Secret, Properties: { Name: wyfn/card/debit, KmsKeyId: !Ref CardKey, Description: 'Virtual debit card. Value set by BK with scripts/card-provision.sh' } }
  WorkerKeySecret: { Type: AWS::SecretsManager::Secret, Properties: { Name: wyfn/worker-key, GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true } } }
  CardSecretPolicyPrimary:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref CardPrimarySecret
      ResourcePolicy:
        Statement: [{ Effect: Deny, Principal: '*', Action: secretsmanager:GetSecretValue, Resource: '*', Condition: { ArnNotEquals: { 'aws:PrincipalArn': !GetAtt ReleaseRole.Arn } } }]
  CardSecretPolicyBackup:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref CardBackupSecret
      ResourcePolicy:
        Statement: [{ Effect: Deny, Principal: '*', Action: secretsmanager:GetSecretValue, Resource: '*', Condition: { ArnNotEquals: { 'aws:PrincipalArn': !GetAtt ReleaseRole.Arn } } }]

  # ---------- ledger and config (kill switch, caps, keys): written by BK in the console, read by the function ----------
  Ledger:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: wyfn-release
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  # ---------- the release function ----------
  ReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }] }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: release
          PolicyDocument:
            Statement:
              # By name, not !Ref: the card key's policy names this role, so a reference back would be a cycle.
              - { Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wyfn/card/*' }
              - { Effect: Allow, Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem], Resource: !GetAtt Ledger.Arn }
  ReleaseFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: wyfn-release
      Runtime: nodejs22.x
      Handler: handler.handler
      Role: !GetAtt ReleaseRole.Arn
      Timeout: 10
      MemorySize: 256
      ReservedConcurrentExecutions: 2
      Environment: { Variables: { LEDGER_TABLE: wyfn-release } }
      Code: { ZipFile: "exports.handler = async () => ({ ok: false, why: 'not deployed: upload the reviewed release build' });" }
  ReleaseInvoke: { Type: AWS::Lambda::Permission, Properties: { FunctionName: !Ref ReleaseFunction, Action: lambda:InvokeFunction, Principal: !GetAtt WorkerRole.Arn } }

  # ---------- the worker ----------
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }] }
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Statement:
              - { Effect: Allow, Action: lambda:InvokeFunction, Resource: !GetAtt ReleaseFunction.Arn }
              - { Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref WorkerKeySecret }
  WorkerProfile: { Type: AWS::IAM::InstanceProfile, Properties: { Roles: [!Ref WorkerRole] } }
  WorkerTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: HasWorker
    Properties:
      LaunchTemplateData:
        ImageId: !GetAtt WorkerImage.ImageId
        # The worker's settings (none secret; the worker key is read from Secrets Manager), written at every boot.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            install -d -m 0755 /etc/wyfn
            cat > /etc/wyfn/worker.env <<EOF
            WYFN_SITE=https://${SiteHost}
            WYFN_WORKER_ID=aws-worker-1
            WYFN_REGION=${AWS::Region}
            WYFN_RELEASE_FN=${ReleaseFunction}
            WYFN_WORKER_KEY_ID=${WorkerKeySecret}
            WYFN_PROXY=http://${Proxy.PrivateIp}:3128
            CHROME_PATH=/opt/chromium/chrome-linux64/chrome
            WYFN_LIVE=1
            EOF
            chmod 0644 /etc/wyfn/worker.env
            systemctl restart wyfn-worker.service
        InstanceType: t3.medium
        IamInstanceProfile: { Arn: !GetAtt WorkerProfile.Arn }
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled }
        NetworkInterfaces: [{ DeviceIndex: 0, AssociatePublicIpAddress: false, Groups: [!Ref WorkerSg] }]
        BlockDeviceMappings: [{ DeviceName: /dev/sda1, Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true } }]
  # The worker runs only in payment hours (the site's own payment-hours setting is the same 8am to 8pm New York):
  # billed by the hour, so half the day off is half the server cost. Replaced automatically if it fails meanwhile.
  WorkerGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: HasWorker
    Properties:
      MinSize: '0'
      MaxSize: '1'
      DesiredCapacity: '0'
      VPCZoneIdentifier: [!Ref WorkerSubnetA, !Ref WorkerSubnetB]
      LaunchTemplate: { LaunchTemplateId: !Ref WorkerTemplate, Version: !GetAtt WorkerTemplate.LatestVersionNumber }
      HealthCheckType: EC2

  WorkerOn:
    Type: AWS::AutoScaling::ScheduledAction
    Condition: HasWorker
    Properties: { AutoScalingGroupName: !Ref WorkerGroup, Recurrence: '45 7 * * *', TimeZone: America/New_York, MinSize: 1, MaxSize: 1, DesiredCapacity: 1 }
  WorkerOff:
    Type: AWS::AutoScaling::ScheduledAction
    Condition: HasWorker
    Properties: { AutoScalingGroupName: !Ref WorkerGroup, Recurrence: '15 20 * * *', TimeZone: America/New_York, MinSize: 0, MaxSize: 1, DesiredCapacity: 0 }

  # ---------- worker releases: EC2 Image Builder, from the one commit BK approved (WorkerCommit) ----------
  # BK creates the secret's value himself: a fine-grained GitHub token with read-only "Contents" on
  # bkhomephotos/wyfn-filing-worker and nothing else. Only the temporary build instance can read it.
  GitHubReadSecret: { Type: AWS::SecretsManager::Secret, Properties: { Name: wyfn/github-read, Description: 'Read-only GitHub token for worker builds. Value set by BK in the console' } }
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }] }
      # Image Builder drives its build instances through Systems Manager; the worker itself has neither.
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore, arn:aws:iam::aws:policy/EC2InstanceProfileForImageBuilder]
      Policies: [{ PolicyName: github-token, PolicyDocument: { Statement: [{ Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref GitHubReadSecret }] } }]
  BuildProfile: { Type: AWS::IAM::InstanceProfile, Properties: { Roles: [!Ref BuildRole] } }
  WorkerBuildInfra:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: wyfn-worker-build
      InstanceProfileName: !Ref BuildProfile
      InstanceTypes: [t3.medium]
      SubnetId: !Ref BuildSubnet
      SecurityGroupIds: [!Ref BuildSg]
      TerminateInstanceOnFailure: true
      InstanceMetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
  # Bump Version whenever Data changes (components can't be changed in place).
  WorkerBuildComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: wyfn-worker-from-commit
      Version: 1.0.0
      Platform: Linux
      Description: Builds the filing worker from one approved commit of wyfn-filing-worker (image/build.sh)
      Data: |
        name: wyfn-worker-from-commit
        schemaVersion: 1.0
        parameters:
          - Commit:
              type: string
              description: the approved release commit (40 hex characters)
          - Region:
              type: string
              description: where the GitHub token secret is
        phases:
          - name: build
            steps:
              - name: BuildFromCommit
                action: ExecuteBash
                timeoutSeconds: 3600
                inputs:
                  commands:
                    - |
                      set -euo pipefail
                      COMMIT='{{ Commit }}'
                      [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit id"; exit 1; }
                      export DEBIAN_FRONTEND=noninteractive
                      apt-get update && apt-get -y install --no-install-recommends git ca-certificates curl
                      snap install aws-cli --classic
                      TOKEN=$(/snap/bin/aws secretsmanager get-secret-value --region '{{ Region }}' --secret-id wyfn/github-read --query SecretString --output text)
                      AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0); unset TOKEN
                      REPO=https://github.com/bkhomephotos/wyfn-filing-worker.git
                      rm -rf /tmp/src && mkdir /tmp/src && cd /tmp/src && git init -q
                      git -c http.extraHeader="Authorization: Basic $AUTH" fetch -q --depth 1 "$REPO" "$COMMIT"
                      git -c http.extraHeader="Authorization: Basic $AUTH" ls-remote --tags "$REPO" 'refs/tags/worker-v*' > /tmp/tags
                      unset AUTH
                      git checkout -q FETCH_HEAD
                      [ "$(git rev-parse HEAD)" = "$COMMIT" ] || { echo "fetched another commit"; exit 1; }
                      TAG=$(awk -v c="$COMMIT" '$1 == c { t = $2; sub("refs/tags/", "", t); sub(/\^\{\}$/, "", t); print t; exit }' /tmp/tags)
                      [ -n "$TAG" ] || { echo "$COMMIT carries no worker-v* release tag"; exit 1; }
                      RELEASE="$TAG ($COMMIT)" bash image/build.sh
                      cd / && rm -rf /tmp/src /tmp/tags
                      snap remove aws-cli
  WorkerRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Condition: HasWorker
    Properties:
      # The commit and base image are in the name: a new approval (or a new Ubuntu base) is a new recipe.
      Name: !Sub 'wyfn-worker-${WorkerCommit}-${WorkerBaseImage}'
      Version: 1.0.0
      ParentImage: !Ref WorkerBaseImage
      Components:
        - ComponentArn: !GetAtt WorkerBuildComponent.Arn
          Parameters: [{ Name: Commit, Value: [!Ref WorkerCommit] }, { Name: Region, Value: [!Ref 'AWS::Region'] }]
      BlockDeviceMappings: [{ DeviceName: /dev/sda1, Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true } }]
  WorkerImage:
    Type: AWS::ImageBuilder::Image
    Condition: HasWorker
    Properties:
      ImageRecipeArn: !GetAtt WorkerRecipe.Arn
      InfrastructureConfigurationArn: !GetAtt WorkerBuildInfra.Arn
      ImageTestsConfiguration: { ImageTestsEnabled: false }
      EnhancedImageMetadataEnabled: true
      Tags: { wyfn-worker-commit: !Ref WorkerCommit }

  # ---------- the egress proxy (Squid: CONNECT only to the allowlist, SNI must equal the CONNECT host) ----------
  ProxyEip: { Type: AWS::EC2::EIP }
  Proxy:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ProxyAmiId
      InstanceType: t4g.nano
      SubnetId: !Ref ProxySubnet
      SecurityGroupIds: [!Ref ProxySg]
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings: [{ DeviceName: /dev/sda1, Ebs: { VolumeSize: 8, VolumeType: gp3, Encrypted: true } }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          apt-get update && apt-get -y install squid-openssl
          cat > /etc/squid/squid.conf <<CONF
          http_port 3128 ssl-bump generate-host-certificates=off cert=/etc/squid/dummy.pem
          acl allowed dstdomain wyobiz.wyo.gov ${PaymentHost} ${SiteHost}
          acl SSL_ports port 443
          acl CONNECT method CONNECT
          http_access deny !CONNECT
          http_access deny CONNECT !SSL_ports
          http_access allow CONNECT allowed
          http_access deny all
          acl step1 at_step SslBump1
          acl sni_ok ssl::server_name wyobiz.wyo.gov ${PaymentHost} ${SiteHost}
          ssl_bump peek step1
          ssl_bump splice sni_ok
          ssl_bump terminate all
          on_unsupported_protocol tunnel all
          access_log daemon:/var/log/squid/access.log
          CONF
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=unused -keyout /etc/squid/dummy.pem -out /etc/squid/dummy.pem
          systemctl restart squid
  ProxyEipAssoc: { Type: AWS::EC2::EIPAssociation, Properties: { InstanceId: !Ref Proxy, AllocationId: !GetAtt ProxyEip.AllocationId } }

  # ---------- backups: the site's hourly encrypted copies (wyfilingnotices netlify/lib/backup.ts) ----------
  # Each file is encrypted on the site to BK's backup PUBLIC key; only his private key (kept offline) opens them. The
  # site's key below may only PUT under v1/: it can't read, list or delete. Every version is kept and locked for 35
  # days (Object Lock, governance mode), so a site that was taken over can't erase or replace what is already here.
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration: { ObjectLockEnabled: Enabled, Rule: { DefaultRetention: { Mode: GOVERNANCE, Days: 35 } } }
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      LifecycleConfiguration:
        Rules:
          # Manifests: six months of history (latest.bin is rewritten at least daily, so it never expires). Packs are
          # kept: the current manifest may still need an old one.
          - { Id: manifests, Status: Enabled, Prefix: v1/manifests/, ExpirationInDays: 180, NoncurrentVersionExpiration: { NoncurrentDays: 90 } }
  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Statement:
          - { Sid: TlsOnly, Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*'], Condition: { Bool: { 'aws:SecureTransport': 'false' } } }
  # The site's identity for backups. BK creates its access key in the IAM console (Users > this user > Security
  # credentials > Create access key) and pastes it into Netlify as BACKUP_AWS_ACCESS_KEY_ID / _SECRET_ACCESS_KEY.
  SiteBackupUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: put-backups-only
          PolicyDocument: { Statement: [{ Effect: Allow, Action: s3:PutObject, Resource: !Sub '${BackupBucket.Arn}/v1/*' }] }

  # ---------- audit and alarms ----------
  TrailBucket: { Type: AWS::S3::Bucket, DeletionPolicy: Retain, UpdateReplacePolicy: Retain, Properties: { VersioningConfiguration: { Status: Enabled }, PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true } } }
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Statement:
          - { Effect: Allow, Principal: { Service: cloudtrail.amazonaws.com }, Action: s3:GetBucketAcl, Resource: !GetAtt TrailBucket.Arn }
          - { Effect: Allow, Principal: { Service: cloudtrail.amazonaws.com }, Action: s3:PutObject, Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*', Condition: { StringEquals: { 's3:x-amz-acl': bucket-owner-full-control } } }
  TrailLogs: { Type: AWS::Logs::LogGroup, Properties: { RetentionInDays: 365 } }
  TrailLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Statement: [{ Effect: Allow, Principal: { Service: cloudtrail.amazonaws.com }, Action: sts:AssumeRole }] }
      Policies: [{ PolicyName: logs, PolicyDocument: { Statement: [{ Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents], Resource: !GetAtt TrailLogs.Arn }] } }]
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties: { IsLogging: true, S3BucketName: !Ref TrailBucket, IsMultiRegionTrail: true, EnableLogFileValidation: true, CloudWatchLogsLogGroupArn: !GetAtt TrailLogs.Arn, CloudWatchLogsRoleArn: !GetAtt TrailLogsRole.Arn }
  Alerts: { Type: AWS::SNS::Topic, Properties: { Subscription: [{ Protocol: email, Endpoint: !Ref OwnerEmail }] } }
  OtherDecryptFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TrailLogs
      # A decrypt with the CARD key, or a read of a card secret, by anyone but the release function's role.
      FilterPattern: !Sub '{ (($.eventName = "Decrypt" && $.resources[0].ARN = "${CardKey.Arn}") || ($.eventName = "GetSecretValue" && $.requestParameters.secretId = "wyfn/card/*")) && $.userIdentity.sessionContext.sessionIssuer.arn != "${ReleaseRole.Arn}" }'
      MetricTransformations: [{ MetricNamespace: wyfn, MetricName: other-decrypt, MetricValue: '1' }]
  OtherDecryptAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: 'a card decrypt by anything but the release function', Namespace: wyfn, MetricName: other-decrypt, Statistic: Sum, Period: 60, EvaluationPeriods: 1, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref Alerts] }
  KeyPolicyFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TrailLogs
      FilterPattern: '{ ($.eventSource = "kms.amazonaws.com") && (($.eventName = "PutKeyPolicy") || ($.eventName = "ScheduleKeyDeletion") || ($.eventName = "DisableKey")) }'
      MetricTransformations: [{ MetricNamespace: wyfn, MetricName: key-change, MetricValue: '1' }]
  KeyPolicyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: "the card key's policy changed or deletion was scheduled", Namespace: wyfn, MetricName: key-change, Statistic: Sum, Period: 60, EvaluationPeriods: 1, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref Alerts] }

Outputs:
  BackupBucketName: { Value: !Ref BackupBucket, Description: 'set as BACKUP_S3_BUCKET in Netlify (BACKUP_S3_REGION: us-east-1)' }
  SiteBackupUserName: { Value: !Ref SiteBackupUser, Description: 'create its access key in IAM and paste it into Netlify as BACKUP_AWS_ACCESS_KEY_ID and BACKUP_AWS_SECRET_ACCESS_KEY' }
  ProxyAddress: { Value: !GetAtt Proxy.PrivateIp, Description: 'the egress proxy (the launch template writes it into the worker''s /etc/wyfn/worker.env)' }
  WorkerImageId: { Condition: HasWorker, Value: !GetAtt WorkerImage.ImageId, Description: 'the worker image built from WorkerCommit' }
  ReleaseFunctionName: { Value: !Ref ReleaseFunction }
  WorkerKeySecretArn: { Value: !Ref WorkerKeySecret, Description: 'copy its value into Netlify as WORKER_API_KEY (secret-to-secret, never into chat)' }
